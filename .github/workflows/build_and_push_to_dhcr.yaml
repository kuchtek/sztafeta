name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'Dockerfile*'
      - 'requirements.txt'
      - 'data/**'
      - 'microservice/**'
      - 'templates/**'
  pull_request:
    types: [labeled, synchronize]
  
env:
  REGISTRY: ghcr.io
  WEBAPP_IMAGE_NAME: ${{ github.repository }}/webapp
  COLLECTOR_IMAGE_NAME: ${{ github.repository }}/collector

jobs:
  check_version_number:
    name: check version number
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to be able to publish a GitHub release
      issues: write  # to be able to comment on released issues
      pull-requests: write  # to be able to comment on released pull requests
    outputs:
      new_release_published: ${{ steps.semantic_dry.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get semantic release version
        uses: cycjimmy/semantic-release-action@v3
        id: semantic_dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          branches: |
            [
              "+([0-9])?(.{+([0-9]),x}).x",
              "main"
            ]
          extends: |
            conventional-changelog-conventionalcommits@6.1.0
          extra_plugins: |
            @semantic-release/commit-analyzer@9.0.2
            @semantic-release/release-notes-generator@10.0.3
            @semantic-release/github@8.0.7
            @semantic-release/changelog@6.0.2
            @semantic-release/exec@6.0.3
            @semantic-release/git@10.0.1
  tag_version:
    name: release
    needs: [check_version_number]
    permissions:
      contents: write  # to be able to publish a GitHub release
      issues: write  # to be able to comment on released issues
      pull-requests: write  # to be able to comment on released pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # make sure the release step uses its own credentials
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v3
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 19
          branches: |
            [
              "+([0-9])?(.{+([0-9]),x}).x",
              "main"
            ]
          extends: |
            conventional-changelog-conventionalcommits@6.1.0
          extra_plugins: |
            @semantic-release/commit-analyzer@9.0.2
            @semantic-release/release-notes-generator@10.0.3
            @semantic-release/github@8.0.7
            @semantic-release/changelog@6.0.2
            @semantic-release/exec@6.0.3
            @semantic-release/git@10.0.1

      - name: Changelog version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo ${{ steps.semantic.outputs.new_release_version }}

    outputs:
        new_release: ${{ steps.semantic.outputs.new_release_published }}
        new_version: ${{ steps.semantic.outputs.new_release_version }}
  build-push:
    runs-on: ubuntu-latest
    needs: [tag_version]
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Extract metadata
        id: meta-webapp
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEBAPP_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=sha,format=long
            type=semver,pattern={{version}},value=${{ steps.semantic.outputs.new_release_version }}
      - name: Extract collector metadata
        id: meta-collector
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.COLLECTOR_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=sha,format=long
            type=semver,pattern={{version}},value=${{ steps.semantic.outputs.new_release_version }}
      - name: Prepare env variables
        run: |
          echo 'URI="https://hejto.sztafetastat.eu"' >> .env
          echo 'CLIENT_ID="${{ secrets.CLIENT_ID }}"' >> .env
          echo 'CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}"' >> .env
          echo 'STRAVA_CLIENT_ID="${{ secrets.STRAVA_CLIENT_ID }}"' >> .env
          echo 'STRAVA_CLIENT_SECRET="${{ secrets.STRAVA_CLIENT_SECRET }}"' >> .env
          echo 'FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}"' >> .env
      - name: Build and push webapp image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-images') }}
          tags: ${{ steps.meta-webapp.outputs.tags }}
          labels: ${{ steps.meta-webapp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push collector image
        uses: docker/build-push-action@v4
        with:
          context: ./microservice
          file: ./microservice/Dockerfile
          push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-images') }}
          tags: ${{ steps.meta-collector.outputs.tags }}
          labels: ${{ steps.meta-collector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release Update - ${{ steps.semantic.outputs.new_release_version }}
        uses: softprops/action-gh-release@v1
        if: needs.tag_version.outputs.new_release == 'true'
        with:
          tag_name: "v${{ steps.semantic.outputs.new_release_version }}"
          append_body: true
          body: |
            - Github Packages Container URL: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.semantic.outputs.new_release_version }}
          token: ${{ secrets.GITHUB_TOKEN }}